# Indoor class-conditioned survival priors for the open-vocabulary
# persistence belief (paper Table I, indoor). Written 2026-10-18, BEFORE any
# experimental data was generated, from common-sense expectations of how
# long an object of each class stays where it was last seen.
#
# Values are characteristic lifetimes in DAYS (1/lambda_c); the loader
# converts them to lambda_c = 1 / (days * 86400) in s^-1.
# Keys are the AI2-THOR object types; the CLIP zero-shot vocabulary uses the
# same names split into words ("AlarmClock" -> "alarm clock").
#
# The simulator's ground-truth change process does NOT use this table: it
# draws hazards by affordance group only (fixed / moveable / pickupable).
default_days: 30
lifetimes_days:
